name: TwinfoldAR
options:
  bundleIdPrefix: design.twinfold
packages:
  TwinfoldCore:
    path: ../../packages/TwinfoldCore
targets:
  TwinfoldAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [TwinfoldAR]
    dependencies:
      - package: TwinfoldCore
        product: TwinfoldCore
      - package: TwinfoldCore
        product: TwinfoldSpatial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.twinfold.ar
        PRODUCT_NAME: TwinfoldAR
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "AR空間にAssetを配置するためにカメラを使用します"
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
    # Devnetモード（SolanaAssetProvider）がTwinfold API（apps/web、既定
    # http://localhost:3000）へhttpで接続するための追加キー。
    # NSAllowsLocalNetworkingだけを許可し、任意のhttp接続は許可しない
    # （Issue #14）。実機ではTWINFOLD_API_BASE_URLをMacのLAN IPに変更する
    # 必要がある（.claude/skills/ios-realitykit-ar/SKILL.md参照）。
    info:
      path: Generated/Info.plist
      properties:
        TWINFOLD_API_BASE_URL: "http://localhost:3000"
        # 「Phantomで連携」ボタンが開くWebの公開URL（https。実機ではcloudflaredの
        # クイックトンネル等）。空ならTWINFOLD_API_BASE_URLを使う。Phantomの
        # ブラウザから開くので、httpのLAN IPでは動かないことがある。
        TWINFOLD_WEB_URL: ""
        CFBundleDisplayName: Collectibles AR
        # twinfold://link?code=XXXXXXXX（Webの連携QRをiPhoneカメラで読む、Issue #45）
        CFBundleURLTypes:
          - CFBundleURLName: design.twinfold.ar.link
            CFBundleURLSchemes: [twinfold]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
